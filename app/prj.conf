# Enable required Zephyr driver classes
CONFIG_SENSOR=y

# Enable options required by M90E26
CONFIG_M90E26=y

CONFIG_SERIAL=y
# 啟用 Zephyr 標準的 Sensor API
CONFIG_SENSOR=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# 啟用日誌以方便除錯
CONFIG_LOG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=10240